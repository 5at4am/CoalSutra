services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cmpdi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmpdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmpdi}
      POSTGRES_DB: ${POSTGRES_DB:-cmpdi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmpdi} -d ${POSTGRES_DB:-cmpdi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cmpdi-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cmpdi}:${POSTGRES_PASSWORD:-cmpdi}@db:5432/${POSTGRES_DB:-cmpdi}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cmpdi-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata: