[project]
name = "coalsutra-backend"
version = "0.1.0"
description = "CoalSutra CMPDI reporting assistant - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.1",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pgvector==0.3.6",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "reportlab==4.2.2",
    "python-docx==1.1.2",
    "pypdf==5.1.0",
    "pdfplumber==0.11.5",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "pytesseract==0.3.13",
    "pdf2image==1.17.0",
    "rapidocr_onnxruntime==1.2.3",
    "pymupdf==1.28.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "fpdf2==2.8.2",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-OCR / network-backed tests (default-skipped). Run with --run-slow",
]
addopts = "-m 'not slow'"